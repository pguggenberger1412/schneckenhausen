<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" type="text/css" href="global.css">
    <title>Schneckenhausen</title>
</head>

<body>

    <header class="site-header">
        <a href="https://schneckenhausen.com" class="brand-link" title="Zurück zur Startseite">
            <!-- Vektor-Schnecken-Icon (SVG: Direkt eingebettet, lädt sofort & benötigt keine Bilddatei) -->
            <svg class="brand-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <!-- Schneckenhaus -->
                <path fill="currentColor"
                    d="M36,12 C22.7,12 12,22.7 12,36 C12,49.3 22.7,60 36,60 C49.3,60 60,49.3 60,36 C60,22.7 49.3,12 36,12 Z M36,52 C27.2,52 20,44.8 20,36 C20,27.2 27.2,20 36,20 C44.8,20 52,27.2 52,36 C52,44.8 44.8,52 36,52 Z M36,28 C31.6,28 28,31.6 28,36 C28,40.4 31.6,44 36,44 C40.4,44 44,40.4 44,36 C44,31.6 40.4,28 36,28 Z" />
                <!-- Körper & Fühler -->
                <path fill="currentColor"
                    d="M4,48 C4,48 12,40 24,44 C24,44 14,58 4,58 C4,58 2,54 4,48 Z M14,40 L8,28 M18,38 L14,24"
                    stroke="currentColor" stroke-width="4" stroke-linecap="round" />
            </svg>

            <!-- ALTERNATIVE: Falls du ein heruntergeladenes Icon von Flaticon nutzt, ersetze das SVG durch diesen Tag: -->
            <!-- <img src="assets/snail.svg" alt="Schnecke" class="brand-icon"> -->

            <span class="brand-title">Schneckenhausen</span>
        </a>
    </header>

    <main class="container">
        <div class="grid grid-2">

            <!-- Kachel 1: Hochzeit -->
            <a href="https://hochzeit.schneckenhausen.com" class="card">
                <div>
                    <span class="card-badge">Event</span>
                    <h2 class="card-title">Hochzeit</h2>
                    <p class="card-body">Save the Date, Location & alle wichtigen Infos zu unserem großen Tag.</p>
                </div>
                <div class="card-footer">
                    <span>Zur Hochzeitsseite</span>
                    <span class="arrow">&rarr;</span>
                </div>
            </a>

            <!-- Kachel 2: Eis-Rezepte -->
            <a href="https://eis.schneckenhausen.com" class="card">
                <div>
                    <span class="card-badge">Rezepte</span>
                    <h2 class="card-title">Ninja Creami Eisrezepte</h2>
                    <p class="card-body">Unsere besten Proteineis-Kreationen & Zubereitungstipps.</p>
                </div>
                <div class="card-footer">
                    <span>Zu den Rezepten</span>
                    <span class="arrow">&rarr;</span>
                </div>
            </a>

        </div>
    </main>

    <footer>
        <p>&copy; Schneckenhausen - Philipp & Franziska</p>
    </footer>

</body>

</html>
